<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>我在这儿就能为你下厨了 · 网页 Demo</title>
<link rel="preload" as="image" href="../icancook/game/images/key_visual.jpg">
<style>
  :root{
    --ink:#0b0805;
    --paper:#e8e0d4;
    --dim:#a89a88;
    --dim2:#6b5c4d;
    --gold:#d9a05f;
    --blue:#a8c4d4;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; height:100%; background:#000; overflow:hidden}
  body{
    font-family:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    color:var(--paper);
    display:flex; align-items:center; justify-content:center;
  }

  /* ---------- 舞台：16:9，等比缩放 ---------- */
  #stage{
    position:relative;
    width:min(100vw, 177.78vh);
    height:min(56.25vw, 100vh);
    overflow:hidden;
    background:#000;
    cursor:pointer;
    container-type:size;
  }

  #bg,#char{
    position:absolute; inset:0;
    background-size:cover;
    background-position:center 46%;
    opacity:0;
    transition:opacity 1s ease, transform .9s ease-out;
    will-change:transform,opacity;
  }
  #char{ mix-blend-mode:normal; }
  #vig{
    position:absolute; inset:0;
    background:radial-gradient(ellipse at 50% 46%, rgba(0,0,0,0) 26%, rgba(0,0,0,.35) 62%, rgba(0,0,0,.86) 100%);
    pointer-events:none;
  }
  #grain{
    position:absolute; inset:-10%;
    opacity:.05;
    pointer-events:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='120' height='120' filter='url(%23n)' opacity='.9'/></svg>");
  }

  /* ---------- 对白框 ---------- */
  #box{
    position:absolute;
    left:0; right:0; bottom:0;
    min-height:20.5%;
    padding:2.2cqh 6.5cqw 3.4cqh;
    background:linear-gradient(to top, rgba(8,6,4,.92) 40%, rgba(8,6,4,.72) 78%, rgba(8,6,4,0));
    opacity:0;
    transition:opacity .5s ease;
  }
  #stage.playing #box{opacity:1}
  #box.empty{opacity:0 !important}

  #who{
    font-size:1.85cqh; letter-spacing:.18em;
    color:var(--gold); height:2.6cqh; margin-bottom:1.1cqh;
    opacity:.95;
  }
  #who.you,#who.note{color:transparent}

  #text{
    font-size:2.55cqh;
    line-height:1.85;
    max-width:74cqw;
    min-height:5.2cqh;
    text-shadow:0 1px 2px rgba(0,0,0,.8);
    white-space:pre-wrap;
  }
  #text.note{color:#a89a88; font-style:normal}
  #text.you{color:#cfc6b8}

  #next{
    position:absolute; right:4.6cqw; bottom:2.4cqh;
    width:0; height:0;
    border-left:.85cqh solid transparent;
    border-right:.85cqh solid transparent;
    border-top:1.1cqh solid rgba(240,230,215,.75);
    animation:breathe 1.9s ease-in-out infinite;
    transition:opacity .3s;
  }
  #next.hide{opacity:0}
  @keyframes breathe{0%,100%{opacity:.28; transform:translateY(0)}50%{opacity:.85; transform:translateY(.32cqh)}}

  /* ---------- 选项 ---------- */
  #choices{
    position:absolute; inset:0;
    display:none;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:1.5cqh;
    background:radial-gradient(ellipse at 50% 55%, rgba(6,4,2,.55), rgba(6,4,2,.82));
    padding:0 8cqw;
  }
  #choices.show{display:flex}
  .choice{
    position:relative;
    display:flex; align-items:center;
    gap:1.4cqw;
    width:min(72cqw, 62em);
    padding:1.55cqh 2.2cqw;
    font:inherit; font-size:2.2cqh; color:#cfc3b2;
    background:rgba(14,10,7,.82);
    border:none;
    border-radius:1px;
    text-align:left;
    cursor:pointer;
    opacity:0;
    transform:translateY(.8cqh);
    animation:choiceIn .38s ease forwards;
    transition:background .22s, color .22s;
  }
  .choice .bar{
    width:2px; height:1.9cqh; background:var(--gold);
    opacity:0; transition:opacity .22s; flex:0 0 auto;
  }
  .choice:hover{background:rgba(30,22,15,.94); color:#f6e9d6}
  .choice:hover .bar{opacity:1}
  @keyframes choiceIn{to{opacity:1; transform:translateY(0)}}

  /* ---------- 居中独白 ---------- */
  #center{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    background:#000;
    opacity:0; pointer-events:none;
    transition:opacity .9s ease;
    padding:0 12cqw;
  }
  #center.show{opacity:1; pointer-events:auto}
  .centerText{
    font-size:2.25cqh; line-height:2.1; text-align:center; white-space:pre-wrap;
  }

  /* ---------- 气味交互 ---------- */
  #smell{
    position:absolute; inset:0;
    display:none;
    background:rgba(5,4,2,.62);
    backdrop-filter:saturate(.35) brightness(.72);
    -webkit-backdrop-filter:saturate(.35) brightness(.72);
  }
  #smell.show{display:block}

  .smellHead{position:absolute; left:0; right:0; top:7cqh; text-align:center}
  .smellHead .t{font-size:1.7cqh; letter-spacing:.6em; color:var(--gold)}
  .smellHead .s{font-size:1.75cqh; color:#b9ac9a; margin-top:1.4cqh}

  .hotspot{
    position:absolute;
    transform:translate(-50%,-50%);
    background:transparent;
    border:1px dashed rgba(217,160,95,.34);
    border-radius:2px;
    cursor:pointer;
    transition:background .25s, border-color .25s;
  }
  .hotspot span{
    position:absolute; left:50%; top:110%; transform:translateX(-50%);
    font-size:1.5cqh; color:rgba(232,220,200,.62); white-space:nowrap;
    opacity:0; transition:opacity .25s;
  }
  .hotspot:hover{background:rgba(217,160,95,.14); border-color:rgba(217,160,95,.8)}
  .hotspot:hover span{opacity:1}
  .hotspot.seen{border-color:rgba(217,160,95,.16)}
  .hotspot.seen span{opacity:.5}

  .smellInfo{
    position:absolute; left:6cqw; top:44cqh;
    width:44cqw; padding:2.2cqh 2.2cqw;
    background:rgba(9,7,4,.9);
    border-left:2px solid var(--gold);
    opacity:0; transform:translateY(.6cqh);
    transition:opacity .28s, transform .28s;
  }
  .smellInfo.show{opacity:1; transform:translateY(0)}
  .smellInfo .note{font-size:1.55cqh; color:var(--gold); margin-bottom:1cqh; letter-spacing:.05em}
  .smellInfo .line{font-size:2.05cqh; line-height:1.9; color:#e8e0d4}

  .smellCount{
    position:absolute; left:6cqw; bottom:5cqh;
    font-size:1.6cqh; color:var(--dim2); letter-spacing:.1em;
  }
  .smellCount.full{color:var(--gold)}

  .leave{
    position:absolute; right:6cqw; bottom:4.4cqh;
    padding:1.2cqh 2.4cqw;
    font:inherit; font-size:1.9cqh; color:#cfc3b2;
    background:rgba(20,15,10,.9); border:1px solid rgba(217,160,95,.35);
    cursor:pointer; transition:all .22s;
  }
  .leave:hover{color:#f6e9d6; border-color:var(--gold); background:rgba(40,28,18,.95)}

  /* ---------- 快捷条 ---------- */
  #quick{
    position:absolute; right:2.4cqw; top:1.6cqh;
    display:flex; gap:1.6cqw;
    font-size:1.35cqh; color:rgba(200,185,165,.42);
    opacity:0; transition:opacity .3s;
  }
  #stage.playing #quick{opacity:1}
  #quick:hover{opacity:1 !important; color:rgba(230,215,195,.9)}
  #quick span{cursor:pointer; transition:color .2s}
  #quick span:hover{color:var(--gold)}

  /* ---------- 记录 ---------- */
  #history{
    position:absolute; inset:0;
    display:none;
    background:rgba(4,3,2,.94);
    padding:5cqh 10cqw;
  }
  #history.show{display:block}
  #history h3{
    font-size:1.7cqh; font-weight:400; letter-spacing:.4em; color:var(--gold);
    margin:0 0 3cqh;
  }
  #historyList{
    height:78%;
    overflow-y:auto;
    padding-right:2cqw;
  }
  #historyList::-webkit-scrollbar{width:3px}
  #historyList::-webkit-scrollbar-thumb{background:rgba(217,160,95,.4)}
  .hrow{display:flex; gap:2.4cqw; margin-bottom:2.2cqh; font-size:2cqh; line-height:1.85}
  .hname{width:9cqw; flex:0 0 auto; color:var(--gold); font-size:1.7cqh; padding-top:.3cqh}
  .htext{color:#cfc6b8; flex:1}
  #closeHistory{
    position:absolute; right:8cqw; top:4cqh;
    background:none; border:none; color:var(--dim); font:inherit; font-size:1.8cqh; cursor:pointer;
  }
  #closeHistory:hover{color:var(--gold)}

  /* ---------- 标题页 ---------- */
  #title{
    position:absolute; inset:0;
    display:flex; flex-direction:column; justify-content:flex-end;
    padding:0 8cqw 8cqh;
    background:
      linear-gradient(to top, rgba(6,4,2,.95) 12%, rgba(6,4,2,.55) 46%, rgba(6,4,2,.15) 70%),
      url("../icancook/game/images/key_visual.jpg") center 44%/cover no-repeat;
    transition:opacity 1s ease, transform 1.4s ease;
    z-index:20;
  }
  #title.hidden{opacity:0; transform:scale(1.06); pointer-events:none}

  #title .kicker{
    font-size:1.5cqh; letter-spacing:.5em; color:var(--dim2); margin-bottom:2.4cqh;
  }
  #title h1{
    margin:0;
    font-size:5.2cqh;
    font-weight:400;
    letter-spacing:.06em;
    color:#f3e7d6;
    text-shadow:0 2px 24px rgba(0,0,0,.9);
    line-height:1.3;
  }
  #title .en{
    font-size:1.75cqh; letter-spacing:.32em; color:#9d8d7a; margin-top:1.6cqh;
    text-transform:uppercase;
  }
  #title .rule{width:9cqw; height:1px; background:rgba(217,160,95,.5); margin:3cqh 0}
  #title .desc{
    max-width:52cqw; font-size:1.95cqh; line-height:2; color:#b9ac9a;
  }
  #title .desc em{color:var(--gold); font-style:normal}

  #startBtn{
    margin-top:3.4cqh;
    align-self:flex-start;
    padding:1.7cqh 3.6cqw;
    font:inherit; font-size:2.15cqh; letter-spacing:.28em;
    color:#131009;
    background:var(--gold);
    border:none; cursor:pointer;
    transition:background .25s, letter-spacing .25s, transform .25s;
  }
  #startBtn:hover{background:#efc79a; letter-spacing:.4em; transform:translateX(.4cqw)}

  #endList{
    list-style:none; padding:0; margin:3.2cqh 0 0;
    display:flex; gap:2.4cqw; flex-wrap:wrap;
    font-size:1.5cqh; color:var(--dim2);
  }
  #endList li.got{color:var(--gold)}

  #warn{
    margin-top:2.6cqh; font-size:1.35cqh; color:#5e5347; line-height:1.9; max-width:52cqw;
  }
</style>
</head>
<body>
<div id="stage">

  <div id="bg"></div>
  <div id="char"></div>
  <div id="vig"></div>
  <div id="grain"></div>

  <div id="box" class="empty">
    <div id="who"></div>
    <div id="text"></div>
    <div id="next"></div>
  </div>

  <div id="choices"></div>
  <div id="center"><div class="centerText"></div></div>
  <div id="smell"></div>

  <div id="quick">
    <span data-act="history">记录</span>
    <span data-act="skip">跳过</span>
    <span data-act="restart">重来</span>
  </div>

  <div id="history">
    <h3>记录</h3>
    <button id="closeHistory">关闭</button>
    <div id="historyList"></div>
  </div>

  <div id="title">
    <div class="kicker">CHAPTER 0 · 重制版第一次约会</div>
    <h1>我在这儿就能为你下厨了</h1>
    <div class="en">I Can Cook For You From Here</div>
    <div class="rule"></div>
    <div class="desc">
      上一次约会，你为了<em>不被吃掉</em>而撒谎。<br>
      这一次，你要决定敢不敢让她闻出真话来。
    </div>
    <button id="startBtn">开始</button>
    <ul id="endList"></ul>
    <div id="warn">
      非官方恋爱向同人作品 · 原作《I Can Smell You From Here》© catproblem9735<br>
      本 Demo 与 Windows exe 版共用同一份剧本（icancook/game/script.rpy 自动转译）
    </div>
  </div>

</div>
<script src="engine.js"></script>
</body>
</html>
